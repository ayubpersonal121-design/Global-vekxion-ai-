<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="109" fill="none" stroke="url(#neonGrad)" stroke-width="3" opacity="0.4"/>

  <!-- Glowing Pixel Matrix Core -->
  <g filter="url(#glow)">
    <!-- Central Hexagonal / Pixel Brain Node -->
    <rect x="216" y="216" width="80" height="80" rx="18" fill="url(#neonGrad)"/>
    
    <!-- Outer Floating Pixels -->
    <rect x="136" y="156" width="48" height="48" rx="12" fill="#38bdf8"/>
    <rect x="328" y="156" width="48" height="48" rx="12" fill="#818cf8"/>
    <rect x="136" y="308" width="48" height="48" rx="12" fill="#34d399"/>
    <rect x="328" y="308" width="48" height="48" rx="12" fill="#38bdf8"/>
    
    <!-- Orbital Mini Pixels -->
    <rect x="236" y="116" width="40" height="40" rx="10" fill="#60a5fa"/>
    <rect x="236" y="356" width="40" height="40" rx="10" fill="#10b981"/>
    <rect x="96" y="236" width="40" height="40" rx="10" fill="#38bdf8"/>
    <rect x="376" y="236" width="40" height="40" rx="10" fill="#a855f7"/>
    
    <!-- Connection Cyber Traces -->
    <path d="M184 180 L216 236 M328 180 L296 236 M184 332 L216 276 M328 332 L296 276" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,4" opacity="0.8"/>
  </g>
  
  <!-- Central Sparkle Glyph -->
  <path d="M256 232 L262 250 L280 256 L262 262 L256 280 L250 262 L232 256 L250 250 Z" fill="#ffffff"/>
</svg>
